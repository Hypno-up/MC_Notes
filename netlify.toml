# Le dépôt contient aussi le projet Android (android/, resources/), qui n'a rien
# à faire en ligne. On publie donc `www/`, construit par `npm run build:www` —
# exactement le même dossier que celui embarqué dans l'APK, ce qui garantit que
# le web et l'application servent le même code.
[build]
  command = "npm run build:www"
  publish = "www"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

  # L'analyse de secrets de Netlify prend la cle Firebase du client pour une
  # fuite et bloque la construction. Ce n'en est pas une : une cle Web Firebase
  # est un identifiant public de projet, presente dans toute application web
  # Firebase. La securite repose sur les regles Firestore, pas sur elle.
  #
  # On declare cette valeur precise plutot que de desactiver l'analyse : tout
  # vrai secret qui viendrait a se glisser dans le depot sera toujours detecte.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyCffPMQ1sVISIUDjYr2-cQ6MK3zEqMr2LE"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MCNote V2 - Gestionnaire d'Événements</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(30, 30, 50, 0.95);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ==================== AUTH PAGE ==================== */
        #authPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .auth-logo i {
            font-size: 2rem;
            color: white;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-header p {
            color: var(--text-secondary);
            margin-top: 5px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .auth-input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .auth-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(255,255,255,0.08);
        }

        .auth-input::placeholder {
            color: var(--text-secondary);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
        }

        .auth-switch a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-error {
            color: var(--danger);
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* ==================== HOME PAGE ==================== */
        #homePage {
            display: none;
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 100px;
        }

        .home-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .home-header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-email {
            color: var(--text-secondary);
            font-size: 0.8rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .events-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }

        .event-card {
            background: var(--bg-card);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .event-card:active {
            background: rgba(99, 102, 241, 0.2);
            transform: scale(0.98);
        }

        .event-card-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .event-card-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .event-card-icon i {
            color: white;
        }

        .event-card-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .event-card-meta {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .event-card-actions {
            display: flex;
            gap: 8px;
        }

        .event-delete-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #f87171;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .create-event-card {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: white;
            font-weight: 600;
        }

        .create-event-card:active {
            background: linear-gradient(135deg, #5457d6, #7c3aed);
        }

        .import-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .import-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 10px;
        }

        .import-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .import-tab.active {
            background: var(--accent-primary);
            color: white;
        }

        .import-content {
            display: none;
        }

        .import-content.active {
            display: block;
        }

        .import-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .import-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .import-btn {
            width: 100%;
            padding: 12px;
            background: var(--success);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .import-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ==================== SEQUENCE VIEW PAGE ==================== */
        #sequencePage {
            display: none;
            height: 100vh;
            height: 100dvh;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ==================== BARRE DE PROGRESSION LATÉRALE ==================== */
        .progress-sidebar {
            position: absolute;
            left: 0;
            top: 55px;
            bottom: 65px;
            width: 35px;
            background: rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            z-index: 50;
            gap: 4px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .progress-sidebar::-webkit-scrollbar {
            display: none;
        }

        .progress-item {
            width: 26px;
            min-height: 26px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            position: relative;
        }

        .progress-item:active {
            transform: scale(1.1);
        }

        .progress-item.current {
            background: var(--accent-primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .progress-item.validated {
            background: var(--success);
        }

        .progress-item.validated.current {
            background: var(--success);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        /* Tooltip titre séquence */
        .progress-tooltip {
            position: fixed;
            left: 45px;
            background: var(--bg-card);
            border: 1px solid var(--accent-primary);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            max-width: 250px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: none;
            animation: tooltipFadeIn 0.15s ease;
        }

        .progress-tooltip .tooltip-time {
            color: var(--accent-secondary);
            font-weight: 600;
            font-size: 0.8rem;
        }

        .progress-tooltip .tooltip-title {
            margin-top: 3px;
        }

        @keyframes tooltipFadeIn {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Previous Sequence Header */
        .prev-sequence-bar {
            flex-shrink: 0;
            background: rgba(30, 30, 50, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px 15px;
            padding-left: 45px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            min-height: 55px;
        }

        .prev-sequence-bar:active {
            background: rgba(99, 102, 241, 0.2);
        }

        .prev-sequence-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .prev-sequence-info i {
            color: var(--accent-primary);
        }

        .prev-sequence-info .time {
            color: var(--accent-secondary);
            font-weight: 600;
        }

        .home-btn {
            background: var(--bg-card);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Sequence Content */
        .sequence-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            padding-left: 45px;
            overflow: hidden;
        }

        .sequence-header {
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        .sequence-time {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        /* Séquence validée */
        .sequence-validated .sequence-time {
            color: var(--success);
        }

        .sequence-validated .sequence-content {
            border: 2px solid var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .sequence-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 3px;
        }

        .sequence-people {
            color: var(--accent-secondary);
            font-size: 0.9rem;
            margin-top: 3px;
        }

        /* Content Area */
        .sequence-content {
            flex: 1;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: all 0.3s;
        }

        .content-text {
            flex: 1;
            overflow: hidden;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .content-truncated::after {
            content: '';
            position: absolute;
            bottom: 180px;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(transparent, var(--bg-card));
            pointer-events: none;
        }

        /* Quick Note */
        .quick-note-section {
            flex-shrink: 0;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .quick-note-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 8px 10px;
            color: var(--text-primary);
            font-size: 0.85rem;
            resize: none;
            height: 45px;
        }

        .quick-note-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .quick-note-input::placeholder {
            color: var(--text-secondary);
        }

        /* Action Buttons */
        .content-actions {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            gap: 6px;
        }

        .action-icon-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: var(--text-primary);
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .action-icon-btn:active {
            background: var(--accent-primary);
        }

        .action-icon-btn.prompter-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        .action-icon-btn.expand-btn {
            background: var(--warning);
            color: #000;
        }

        .action-icon-btn.edit-btn {
            background: rgba(99, 102, 241, 0.3);
        }

        .action-icon-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Bouton de validation */
        .validate-section {
            flex-shrink: 0;
            margin-top: 10px;
        }

        .validate-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            background: var(--success);
            color: white;
        }

        .validate-btn:active {
            transform: scale(0.98);
        }

        .validate-btn.validated {
            background: rgba(255,255,255,0.1);
            color: var(--success);
            border: 2px solid var(--success);
        }

        .validate-btn.validated i {
            color: var(--success);
        }

        /* Next Sequence Footer */
        .next-sequence-bar {
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            padding: 12px 15px;
            padding-left: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            min-height: 65px;
        }

        .next-sequence-bar:active {
            filter: brightness(1.1);
        }

        .next-sequence-bar.disabled {
            background: rgba(100,100,120,0.5);
            cursor: default;
        }

        .next-sequence-info {
            text-align: center;
        }

        .next-sequence-info .label {
            font-size: 0.65rem;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .next-sequence-info .title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .next-sequence-info .time {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        /* ==================== POPUP MODAL ==================== */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup-header {
            flex-shrink: 0;
            padding: 15px;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-header h3 {
            font-size: 1.1rem;
        }

        .popup-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .popup-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            font-size: 1.1rem;
            line-height: 1.9;
            white-space: pre-wrap;
        }

        .popup-footer {
            flex-shrink: 0;
            padding: 15px;
            background: var(--bg-card);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
        }

        .popup-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .popup-btn.close-btn {
            background: var(--danger);
            color: white;
        }

        .popup-btn.prompter-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        /* ==================== PROMPTER ==================== */
        .prompter-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 2000;
            flex-direction: column;
            touch-action: none;
            overscroll-behavior: none;
        }

        .prompter-overlay.active {
            display: flex;
        }

        .prompter-controls {
            flex-shrink: 0;
            padding: 10px 15px;
            background: rgba(30,30,50,0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            touch-action: manipulation;
        }

        .prompter-control-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .prompter-control-btn.active {
            background: var(--accent-primary);
        }

        .prompter-control-btn.close {
            background: var(--danger);
        }

        .speed-display {
            background: rgba(255,255,255,0.1);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .prompter-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: contain;
        }

        .prompter-guide-line {
            position: absolute;
            top: 30%;
            left: 5%;
            right: 5%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
            z-index: 10;
            pointer-events: none;
        }

        .prompter-guide-line::before {
            content: '▶';
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-primary);
            font-size: 1rem;
        }

        .prompter-text-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            padding-top: calc(30% + 40px);
            transition: transform linear;
        }

        .prompter-text {
            font-size: 1.8rem;
            line-height: 2.2;
            color: white;
            text-align: center;
            white-space: pre-wrap;
        }

        .prompter-text.size-sm { font-size: 1.2rem; }
        .prompter-text.size-md { font-size: 1.8rem; }
        .prompter-text.size-lg { font-size: 2.4rem; }
        .prompter-text.size-xl { font-size: 3rem; }

        /* ==================== CREATE EVENT MODAL ==================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.2rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .modal-btn.cancel {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .modal-btn.save {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        /* ==================== EDIT MODE ==================== */
        .edit-mode-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: var(--warning);
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 100;
            display: none;
        }

        .edit-mode-active .edit-mode-indicator {
            display: block;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--accent-primary);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 5000;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Loading Spinner */
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Utilities */
        .hidden { display: none !important; }

        /* Bloquer le scroll quand le prompteur est actif */
        body.prompter-active {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>
<body>
    <!-- Edit Mode Indicator -->
    <div class="edit-mode-indicator">
        <i class="fas fa-edit"></i> Mode Édition
    </div>

    <!-- ==================== AUTH PAGE ==================== -->
    <div id="authPage">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-microphone-alt"></i>
                </div>
                <h1>MCNote V2</h1>
                <p>Gestionnaire d'événements professionnel</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form">
                <input type="email" id="loginEmail" class="auth-input" placeholder="Adresse e-mail">
                <input type="password" id="loginPassword" class="auth-input" placeholder="Mot de passe">
                <button id="loginBtn" class="auth-btn">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
                <div class="auth-switch">
                    Pas de compte ? <a href="#" id="showSignup">S'inscrire</a>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-form hidden">
                <input type="email" id="signupEmail" class="auth-input" placeholder="Adresse e-mail">
                <input type="password" id="signupPassword" class="auth-input" placeholder="Mot de passe">
                <button id="signupBtn" class="auth-btn">
                    <i class="fas fa-user-plus"></i> S'inscrire
                </button>
                <div class="auth-switch">
                    Déjà un compte ? <a href="#" id="showLogin">Se connecter</a>
                </div>
            </div>

            <div id="authError" class="auth-error"></div>
        </div>
    </div>

    <!-- ==================== HOME PAGE ==================== -->
    <div id="homePage">
        <div class="home-header">
            <h1><i class="fas fa-microphone-alt"></i> MCNote</h1>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- Events Section -->
        <div class="section-title">
            <i class="fas fa-calendar-alt"></i> Mes Événements
        </div>
        <div class="events-grid" id="eventsGrid">
            <!-- Events will be loaded here -->
        </div>

        <!-- Import Section -->
        <div class="import-section">
            <div class="section-title" style="margin-bottom:15px;">
                <i class="fas fa-file-import"></i> Importer
            </div>
            
            <div class="import-tabs">
                <button class="import-tab active" data-tab="csv">CSV</button>
                <button class="import-tab" data-tab="airtable">Airtable</button>
            </div>

            <!-- CSV Import -->
            <div class="import-content active" id="importCSV">
                <input type="text" class="import-input" id="csvEventName" placeholder="Nom de l'événement">
                <input type="file" class="import-input" id="csvFile" accept=".csv">
                <button class="import-btn" id="importCSVBtn">
                    <i class="fas fa-upload"></i> Importer CSV
                </button>
            </div>

            <!-- Airtable Import -->
            <div class="import-content" id="importAirtable">
                <input type="text" class="import-input" id="airtableEventName" placeholder="Nom de l'événement">
                <button class="import-btn" id="importAirtableBtn">
                    <i class="fas fa-database"></i> Importer depuis Airtable
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== SEQUENCE VIEW PAGE ==================== -->
    <div id="sequencePage">
        <!-- Barre de progression latérale -->
        <div class="progress-sidebar" id="progressSidebar">
            <!-- Généré dynamiquement -->
        </div>

        <div class="prev-sequence-bar" onclick="goToPrevious()">
            <div class="prev-sequence-info" id="prevSequenceInfo">
                <i class="fas fa-chevron-up"></i>
                <span class="time">--:--</span>
                <span class="title">--</span>
            </div>
            <button class="home-btn" onclick="event.stopPropagation(); goToHome()">
                <i class="fas fa-home"></i> Accueil
            </button>
        </div>

        <div class="sequence-main" id="sequenceMain">
            <div class="sequence-header">
                <div class="sequence-time" id="currentTime">--:--</div>
                <div class="sequence-title" id="currentTitle">--</div>
                <div class="sequence-people" id="currentPeople"></div>
            </div>

            <div class="sequence-content">
                <div class="content-text" id="contentText"></div>

                <div class="quick-note-section">
                    <textarea 
                        class="quick-note-input" 
                        id="quickNoteInput"
                        placeholder="📝 Note rapide..."
                    ></textarea>
                </div>

                <div class="content-actions">
                    <button class="action-icon-btn edit-btn" onclick="toggleEditMode()">
                        <i class="fas fa-edit"></i> Éditer
                    </button>
                    <button class="action-icon-btn expand-btn" id="expandBtn" onclick="openPopup()">
                        <i class="fas fa-expand"></i> Lire
                    </button>
                    <button class="action-icon-btn prompter-btn" id="prompterBtn" onclick="startPrompter()">
                        <i class="fas fa-scroll"></i> Prompteur
                    </button>
                </div>

                <!-- Bouton Validation -->
                <div class="validate-section">
                    <button class="validate-btn" id="validateBtn" onclick="toggleValidation()">
                        <i class="fas fa-check-circle"></i> <span>Valider la séquence</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="next-sequence-bar" id="nextSequenceBar" onclick="goToNext()">
            <i class="fas fa-chevron-down"></i>
            <div class="next-sequence-info" id="nextSequenceInfo">
                <div class="label">SUIVANT</div>
                <div class="title">--</div>
                <div class="time">--:--</div>
            </div>
            <i class="fas fa-chevron-down"></i>
        </div>
    </div>

    <!-- Tooltip pour barre de progression -->
    <div class="progress-tooltip" id="progressTooltip" style="display:none;">
        <div class="tooltip-time"></div>
        <div class="tooltip-title"></div>
    </div>

    <!-- ==================== POPUP ==================== -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-header">
            <h3 id="popupTitle">--</h3>
            <button class="popup-close" onclick="closePopup()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="popup-content" id="popupContent"></div>
        <div class="popup-footer">
            <button class="popup-btn close-btn" onclick="closePopup()">
                <i class="fas fa-arrow-left"></i> Retour
            </button>
            <button class="popup-btn prompter-btn" id="popupPrompterBtn" onclick="startPrompterFromPopup()">
                <i class="fas fa-scroll"></i> Prompteur
            </button>
        </div>
    </div>

    <!-- ==================== PROMPTER ==================== -->
    <div class="prompter-overlay" id="prompterOverlay">
        <div class="prompter-controls">
            <button class="prompter-control-btn" onclick="adjustPrompterSpeed(-1)">
                <i class="fas fa-minus"></i>
            </button>
            <div class="speed-display" id="speedDisplay">Vitesse: 3</div>
            <button class="prompter-control-btn" onclick="adjustPrompterSpeed(1)">
                <i class="fas fa-plus"></i>
            </button>
            <button class="prompter-control-btn" id="playPauseBtn" onclick="togglePrompterPlayPause()">
                <i class="fas fa-pause"></i>
            </button>
            <button class="prompter-control-btn" onclick="adjustTextSize(-1)">A-</button>
            <button class="prompter-control-btn" onclick="adjustTextSize(1)">A+</button>
            <button class="prompter-control-btn close" onclick="closePrompter()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="prompter-container">
            <div class="prompter-guide-line"></div>
            <div class="prompter-text-container" id="prompterTextContainer">
                <div class="prompter-text size-md" id="prompterText"></div>
            </div>
        </div>
    </div>

    <!-- ==================== CREATE EVENT MODAL ==================== -->
    <div class="modal-overlay" id="createEventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> Nouvel Événement</h2>
                <button class="modal-close" onclick="closeCreateEventModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Nom de l'événement *</label>
                    <input type="text" id="newEventName" placeholder="Ex: Séminaire XYZ">
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeCreateEventModal()">Annuler</button>
                <button class="modal-btn save" onclick="createEmptyEvent()">Créer</button>
            </div>
        </div>
    </div>

    <!-- ==================== FIREBASE & APP SCRIPT ==================== -->
    <script type="module">
        // Firebase imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc, 
            collection, 
            addDoc, 
            query, 
            where, 
            getDocs, 
            deleteDoc, 
            updateDoc, 
            onSnapshot,
            orderBy
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCffPMQ1sVISIUDjYr2-cQ6MK3zEqMr2LE",
            authDomain: "mcnote-2d33b.firebaseapp.com",
            projectId: "mcnote-2d33b",
            storageBucket: "mcnote-2d33b.firebasestorage.app",
            messagingSenderId: "730995541743",
            appId: "1:730995541743:web:ae91b54d0e6253f0803d1a",
            measurementId: "G-265RW13Y79"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==================== STATE ====================
        let currentUser = null;
        let events = [];
        let currentEvent = null;
        let currentSequenceIndex = 0;
        let editMode = false;
        let unsubscribeEvents = null;

        // Prompter state
        let prompterSpeed = 3;
        let prompterPlaying = false;
        let prompterPosition = 0;
        let prompterAnimationId = null;
        let textSizeIndex = 1;
        const textSizes = ['size-sm', 'size-md', 'size-lg', 'size-xl'];
        let prompterAutoResume = true; // Reprend automatiquement au relâchement

        // ==================== AUTH ====================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authPage').style.display = 'none';
                document.getElementById('homePage').style.display = 'block';
                document.getElementById('userEmail').textContent = user.email;
                loadEvents();
            } else {
                currentUser = null;
                document.getElementById('authPage').style.display = 'flex';
                document.getElementById('homePage').style.display = 'none';
                document.getElementById('sequencePage').style.display = 'none';
                if (unsubscribeEvents) {
                    unsubscribeEvents();
                    unsubscribeEvents = null;
                }
            }
        });

        // Auth form switching
        document.getElementById('showSignup').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('authError').textContent = '';
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('authError').textContent = '';
        });

        // Login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                document.getElementById('authError').textContent = 'Veuillez remplir tous les champs';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                document.getElementById('authError').textContent = getAuthErrorMessage(error.code);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
            }
        });

        // Signup
        document.getElementById('signupBtn').addEventListener('click', async () => {
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const btn = document.getElementById('signupBtn');
            
            if (!email || !password) {
                document.getElementById('authError').textContent = 'Veuillez remplir tous les champs';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                document.getElementById('authError').textContent = getAuthErrorMessage(error.code);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> S\'inscrire';
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
        });

        function getAuthErrorMessage(code) {
            const messages = {
                'auth/email-already-in-use': 'Cette adresse e-mail est déjà utilisée',
                'auth/invalid-email': 'Adresse e-mail invalide',
                'auth/weak-password': 'Mot de passe trop faible (min. 6 caractères)',
                'auth/user-not-found': 'Aucun compte avec cette adresse',
                'auth/wrong-password': 'Mot de passe incorrect',
                'auth/invalid-credential': 'Identifiants invalides'
            };
            return messages[code] || 'Erreur de connexion';
        }

        // ==================== EVENTS LOADING ====================
        async function loadEvents() {
            if (!currentUser) return;

            const eventsQuery = query(
                collection(db, "events"),
                where("owner", "==", currentUser.uid)
            );

            unsubscribeEvents = onSnapshot(eventsQuery, async (snapshot) => {
                events = [];
                for (const docSnap of snapshot.docs) {
                    const eventData = { id: docSnap.id, ...docSnap.data() };
                    
                    // Load sequences
                    const seqQuery = query(collection(db, "events", docSnap.id, "sequences"));
                    const seqSnapshot = await getDocs(seqQuery);
                    eventData.sequences = seqSnapshot.docs.map(s => ({ id: s.id, ...s.data() }));
                    
                    // Sort sequences by timing
                    eventData.sequences.sort((a, b) => {
                        const timeA = a.timing || '00:00';
                        const timeB = b.timing || '00:00';
                        return timeA.localeCompare(timeB);
                    });
                    
                    events.push(eventData);
                }
                renderEventsGrid();
            });
        }

        function renderEventsGrid() {
            const grid = document.getElementById('eventsGrid');
            
            let html = `
                <div class="event-card create-event-card" onclick="openCreateEventModal()">
                    <div class="event-card-info">
                        <div class="event-card-icon">
                            <i class="fas fa-plus"></i>
                        </div>
                        <div>
                            <div class="event-card-name">Créer un événement</div>
                            <div class="event-card-meta">Événement vide</div>
                        </div>
                    </div>
                </div>
            `;

            events.forEach(event => {
                const seqCount = event.sequences ? event.sequences.length : 0;
                const validatedCount = event.sequences ? event.sequences.filter(s => s.validated).length : 0;
                html += `
                    <div class="event-card" onclick="openEvent('${event.id}')">
                        <div class="event-card-info">
                            <div class="event-card-icon">
                                <i class="fas fa-calendar-check"></i>
                            </div>
                            <div>
                                <div class="event-card-name">${event.name}</div>
                                <div class="event-card-meta">${validatedCount}/${seqCount} séquences</div>
                            </div>
                        </div>
                        <div class="event-card-actions">
                            <button class="event-delete-btn" onclick="event.stopPropagation(); deleteEvent('${event.id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // Make functions globally accessible
        window.openCreateEventModal = () => {
            document.getElementById('createEventModal').classList.add('active');
            document.getElementById('newEventName').value = '';
        };

        window.closeCreateEventModal = () => {
            document.getElementById('createEventModal').classList.remove('active');
        };

        window.createEmptyEvent = async () => {
            const name = document.getElementById('newEventName').value.trim();
            if (!name) {
                showToast('Veuillez entrer un nom');
                return;
            }

            try {
                await addDoc(collection(db, "events"), {
                    name: name,
                    owner: currentUser.uid,
                    createdAt: new Date()
                });
                closeCreateEventModal();
                showToast('Événement créé !');
            } catch (error) {
                showToast('Erreur: ' + error.message);
            }
        };

        window.deleteEvent = async (eventId) => {
            if (!confirm('Supprimer cet événement ?')) return;
            
            try {
                const seqQuery = query(collection(db, "events", eventId, "sequences"));
                const seqSnapshot = await getDocs(seqQuery);
                for (const seqDoc of seqSnapshot.docs) {
                    await deleteDoc(doc(db, "events", eventId, "sequences", seqDoc.id));
                }
                await deleteDoc(doc(db, "events", eventId));
                showToast('Événement supprimé');
            } catch (error) {
                showToast('Erreur: ' + error.message);
            }
        };

        window.openEvent = (eventId) => {
            currentEvent = events.find(e => e.id === eventId);
            if (!currentEvent) return;

            currentSequenceIndex = 0;
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('sequencePage').style.display = 'flex';
            renderProgressSidebar();
            renderCurrentSequence();
        };

        window.goToHome = () => {
            document.getElementById('sequencePage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
            editMode = false;
            document.body.classList.remove('edit-mode-active');
        };

        // ==================== PROGRESS SIDEBAR ====================
        function renderProgressSidebar() {
            if (!currentEvent || !currentEvent.sequences) return;
            
            const sidebar = document.getElementById('progressSidebar');
            let html = '';
            
            currentEvent.sequences.forEach((seq, index) => {
                const isCurrent = index === currentSequenceIndex;
                const isValidated = seq.validated;
                let classes = 'progress-item';
                if (isCurrent) classes += ' current';
                if (isValidated) classes += ' validated';
                
                html += `
                    <div class="${classes}" 
                         data-index="${index}"
                         data-time="${seq.timing || ''}"
                         data-title="${seq.title || ''}"
                         onclick="goToSequence(${index})"
                         ontouchstart="showProgressTooltip(event, ${index})"
                         ontouchend="hideProgressTooltip()"
                         onmouseenter="showProgressTooltip(event, ${index})"
                         onmouseleave="hideProgressTooltip()">
                        ${index + 1}
                    </div>
                `;
            });
            
            sidebar.innerHTML = html;
        }

        window.goToSequence = (index) => {
            if (index >= 0 && index < currentEvent.sequences.length) {
                currentSequenceIndex = index;
                renderProgressSidebar();
                renderCurrentSequence();
                hideProgressTooltip();
            }
        };

        window.showProgressTooltip = (event, index) => {
            const seq = currentEvent.sequences[index];
            if (!seq) return;
            
            const tooltip = document.getElementById('progressTooltip');
            tooltip.querySelector('.tooltip-time').textContent = seq.timing || '--:--';
            tooltip.querySelector('.tooltip-title').textContent = seq.title || 'Sans titre';
            
            // Positionner le tooltip
            const rect = event.target.getBoundingClientRect();
            tooltip.style.top = rect.top + 'px';
            tooltip.style.display = 'block';
        };

        window.hideProgressTooltip = () => {
            document.getElementById('progressTooltip').style.display = 'none';
        };

        // ==================== SEQUENCE NAVIGATION ====================
        function renderCurrentSequence() {
            if (!currentEvent || !currentEvent.sequences || currentEvent.sequences.length === 0) {
                document.getElementById('currentTime').textContent = '--:--';
                document.getElementById('currentTitle').textContent = 'Aucune séquence';
                document.getElementById('currentPeople').textContent = 'Importez un fichier CSV';
                document.getElementById('contentText').textContent = '';
                return;
            }

            const seq = currentEvent.sequences[currentSequenceIndex];
            const seqMain = document.getElementById('sequenceMain');
            
            // Vérifier si validée
            if (seq.validated) {
                seqMain.classList.add('sequence-validated');
            } else {
                seqMain.classList.remove('sequence-validated');
            }
            
            // Current sequence
            document.getElementById('currentTime').textContent = seq.timing || '--:--';
            document.getElementById('currentTitle').textContent = seq.title || '--';
            document.getElementById('currentPeople').textContent = seq.people || '';
            
            // Build content from questions
            let content = '';
            if (seq.questions && seq.questions.length > 0) {
                seq.questions.forEach((q, i) => {
                    if (q.text) content += q.text + '\n\n';
                    if (q.content) content += q.content + '\n\n';
                });
            }
            content = content.trim();
            
            const contentEl = document.getElementById('contentText');
            contentEl.textContent = content;
            
            // Check if content is long
            const lineCount = content.split('\n').length;
            const isLong = lineCount > 5 || content.length > 300;
            
            if (isLong) {
                contentEl.classList.add('content-truncated');
                document.getElementById('expandBtn').classList.remove('hidden');
            } else {
                contentEl.classList.remove('content-truncated');
                document.getElementById('expandBtn').classList.add('hidden');
            }

            // Prompter button
            const prompterBtn = document.getElementById('prompterBtn');
            if (lineCount < 5 && content.length < 200) {
                prompterBtn.disabled = true;
            } else {
                prompterBtn.disabled = false;
            }

            // Validate button
            const validateBtn = document.getElementById('validateBtn');
            if (seq.validated) {
                validateBtn.classList.add('validated');
                validateBtn.innerHTML = '<i class="fas fa-undo"></i> <span>Rouvrir la séquence</span>';
            } else {
                validateBtn.classList.remove('validated');
                validateBtn.innerHTML = '<i class="fas fa-check-circle"></i> <span>Valider la séquence</span>';
            }

            // Quick note
            document.getElementById('quickNoteInput').value = seq.note || '';

            // Previous sequence
            const prevInfo = document.getElementById('prevSequenceInfo');
            if (currentSequenceIndex > 0) {
                const prev = currentEvent.sequences[currentSequenceIndex - 1];
                prevInfo.innerHTML = `
                    <i class="fas fa-chevron-up"></i>
                    <span class="time">${prev.timing || '--:--'}</span>
                    <span class="title">${prev.title || '--'}</span>
                `;
            } else {
                prevInfo.innerHTML = `
                    <i class="fas fa-flag"></i>
                    <span class="title">Début</span>
                `;
            }

            // Next sequence
            const nextInfo = document.getElementById('nextSequenceInfo');
            const nextBar = document.getElementById('nextSequenceBar');
            if (currentSequenceIndex < currentEvent.sequences.length - 1) {
                const next = currentEvent.sequences[currentSequenceIndex + 1];
                nextBar.classList.remove('disabled');
                nextInfo.innerHTML = `
                    <div class="label">SUIVANT</div>
                    <div class="title">${next.title || '--'}</div>
                    <div class="time">${next.timing || '--:--'}</div>
                `;
            } else {
                nextBar.classList.add('disabled');
                nextInfo.innerHTML = `
                    <div class="label">FIN</div>
                    <div class="title">Dernière séquence</div>
                    <div class="time">--</div>
                `;
            }

            // Update sidebar
            renderProgressSidebar();
        }

        window.goToPrevious = () => {
            if (currentSequenceIndex > 0) {
                currentSequenceIndex--;
                renderCurrentSequence();
            }
        };

        window.goToNext = () => {
            if (currentSequenceIndex < currentEvent.sequences.length - 1) {
                currentSequenceIndex++;
                renderCurrentSequence();
            }
        };

        // ==================== VALIDATION ====================
        window.toggleValidation = async () => {
            if (!currentEvent || !currentEvent.sequences[currentSequenceIndex]) return;
            
            const seq = currentEvent.sequences[currentSequenceIndex];
            const newValidated = !seq.validated;
            
            try {
                await updateDoc(doc(db, "events", currentEvent.id, "sequences", seq.id), {
                    validated: newValidated
                });
                
                // Mettre à jour localement
                seq.validated = newValidated;
                renderCurrentSequence();
                
                showToast(newValidated ? 'Séquence validée ✓' : 'Séquence rouverte');
            } catch (error) {
                showToast('Erreur: ' + error.message);
            }
        };

        // Quick note saving
        document.getElementById('quickNoteInput').addEventListener('input', async (e) => {
            if (!currentEvent || !currentEvent.sequences[currentSequenceIndex]) return;
            
            const seq = currentEvent.sequences[currentSequenceIndex];
            const note = e.target.value;
            
            try {
                await updateDoc(doc(db, "events", currentEvent.id, "sequences", seq.id), {
                    note: note
                });
            } catch (error) {
                console.error('Error saving note:', error);
            }
        });

        // ==================== EDIT MODE ====================
        window.toggleEditMode = () => {
            editMode = !editMode;
            document.body.classList.toggle('edit-mode-active', editMode);
            showToast(editMode ? 'Mode édition activé' : 'Mode édition désactivé');
        };

        // ==================== POPUP ====================
        window.openPopup = () => {
            if (!currentEvent || !currentEvent.sequences[currentSequenceIndex]) return;
            
            const seq = currentEvent.sequences[currentSequenceIndex];
            document.getElementById('popupTitle').textContent = seq.title || '--';
            
            let content = '';
            if (seq.questions && seq.questions.length > 0) {
                seq.questions.forEach(q => {
                    if (q.text) content += q.text + '\n\n';
                    if (q.content) content += q.content + '\n\n';
                });
            }
            document.getElementById('popupContent').textContent = content.trim();
            
            const lineCount = content.split('\n').length;
            const btn = document.getElementById('popupPrompterBtn');
            btn.disabled = (lineCount < 5 && content.length < 200);
            btn.style.opacity = btn.disabled ? '0.4' : '1';
            
            document.getElementById('popupOverlay').classList.add('active');
        };

        window.closePopup = () => {
            document.getElementById('popupOverlay').classList.remove('active');
        };

        // ==================== PROMPTER ====================
        window.startPrompter = () => {
            if (!currentEvent || !currentEvent.sequences[currentSequenceIndex]) return;
            
            const seq = currentEvent.sequences[currentSequenceIndex];
            let content = '';
            if (seq.questions && seq.questions.length > 0) {
                seq.questions.forEach(q => {
                    if (q.text) content += q.text + '\n\n';
                    if (q.content) content += q.content + '\n\n';
                });
            }
            initPrompter(content.trim());
        };

        window.startPrompterFromPopup = () => {
            closePopup();
            startPrompter();
        };

        function initPrompter(text) {
            const prompterText = document.getElementById('prompterText');
            const container = document.getElementById('prompterTextContainer');
            
            prompterText.textContent = text;
            prompterText.className = 'prompter-text ' + textSizes[textSizeIndex];
            
            prompterPosition = 0;
            container.style.transform = `translateY(${prompterPosition}px)`;
            
            prompterPlaying = true;
            document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
            document.getElementById('speedDisplay').textContent = `Vitesse: ${prompterSpeed}`;
            
            document.body.classList.add('prompter-active');
            document.getElementById('prompterOverlay').classList.add('active');
            startPrompterAnimation();
        }

        function startPrompterAnimation() {
            if (prompterAnimationId) cancelAnimationFrame(prompterAnimationId);

            const container = document.getElementById('prompterTextContainer');
            const textEl = document.getElementById('prompterText');
            
            function animate() {
                if (!prompterPlaying) {
                    prompterAnimationId = requestAnimationFrame(animate);
                    return;
                }

                const speed = prompterSpeed * 0.5;
                prompterPosition -= speed;

                const textHeight = textEl.offsetHeight;
                const containerHeight = document.querySelector('.prompter-container').offsetHeight;
                const guideLinePosition = containerHeight * 0.3;
                const maxScroll = -(textHeight + guideLinePosition);

                if (prompterPosition < maxScroll) {
                    prompterPosition = maxScroll;
                }

                container.style.transform = `translateY(${prompterPosition}px)`;
                prompterAnimationId = requestAnimationFrame(animate);
            }

            prompterAnimationId = requestAnimationFrame(animate);
        }

        window.togglePrompterPlayPause = () => {
            prompterPlaying = !prompterPlaying;
            document.getElementById('playPauseBtn').innerHTML = prompterPlaying 
                ? '<i class="fas fa-pause"></i>' 
                : '<i class="fas fa-play"></i>';
        };

        window.adjustPrompterSpeed = (delta) => {
            prompterSpeed = Math.max(1, Math.min(10, prompterSpeed + delta));
            document.getElementById('speedDisplay').textContent = `Vitesse: ${prompterSpeed}`;
        };

        window.adjustTextSize = (delta) => {
            textSizeIndex = Math.max(0, Math.min(textSizes.length - 1, textSizeIndex + delta));
            document.getElementById('prompterText').className = 'prompter-text ' + textSizes[textSizeIndex];
        };

        window.closePrompter = () => {
            if (prompterAnimationId) cancelAnimationFrame(prompterAnimationId);
            prompterPlaying = false;
            document.body.classList.remove('prompter-active');
            document.getElementById('prompterOverlay').classList.remove('active');
        };

        // Prompter touch controls - NOUVEAU : reprise auto au relâchement
        (function() {
            let touchStartY = 0;
            let touchStartPos = 0;
            let isDragging = false;
            let wasPlaying = false;

            const prompterOverlay = document.getElementById('prompterOverlay');

            prompterOverlay.addEventListener('touchstart', (e) => {
                if (e.target.closest('.prompter-controls')) return;
                e.preventDefault();
                touchStartY = e.touches[0].clientY;
                touchStartPos = prompterPosition;
                isDragging = true;
                wasPlaying = prompterPlaying; // Mémoriser l'état
                prompterPlaying = false; // Pause pendant le drag
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
            }, { passive: false });

            prompterOverlay.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                if (e.target.closest('.prompter-controls')) return;
                e.preventDefault();
                const deltaY = e.touches[0].clientY - touchStartY;
                prompterPosition = touchStartPos + deltaY;
                document.getElementById('prompterTextContainer').style.transform = `translateY(${prompterPosition}px)`;
            }, { passive: false });

            // NOUVEAU : Reprend automatiquement quand on lâche
            prompterOverlay.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                isDragging = false;
                // Reprend automatiquement le défilement
                prompterPlaying = true;
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
            }, { passive: true });

            prompterOverlay.addEventListener('touchcancel', (e) => {
                if (!isDragging) return;
                isDragging = false;
                prompterPlaying = true;
                document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-pause"></i>';
            }, { passive: true });
        })();

        // ==================== CSV IMPORT ====================
        document.querySelectorAll('.import-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.import-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.import-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('import' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
            });
        });

        document.getElementById('importCSVBtn').addEventListener('click', async () => {
            const eventName = document.getElementById('csvEventName').value.trim();
            const fileInput = document.getElementById('csvFile');
            
            if (!eventName) {
                showToast('Entrez un nom d\'événement');
                return;
            }
            
            if (!fileInput.files.length) {
                showToast('Sélectionnez un fichier CSV');
                return;
            }

            const btn = document.getElementById('importCSVBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                const file = fileInput.files[0];
                const text = await file.text();
                await processCSV(eventName, text);
                document.getElementById('csvEventName').value = '';
                fileInput.value = '';
                showToast('Import réussi !');
            } catch (error) {
                showToast('Erreur: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-upload"></i> Importer CSV';
            }
        });

        async function processCSV(eventName, csvText) {
            const parsed = Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                transformHeader: h => h.trim().toLowerCase()
            });

            if (parsed.errors.length > 0) {
                throw new Error('Erreur CSV');
            }

            const eventRef = await addDoc(collection(db, "events"), {
                name: eventName,
                owner: currentUser.uid,
                createdAt: new Date()
            });

            const groups = new Map();
            parsed.data.forEach(row => {
                const timing = (row.timing || '').trim();
                const title = (row.title || '').trim();
                if (!timing && !title) return;

                const key = `${timing}|${title}`;
                if (!groups.has(key)) {
                    groups.set(key, {
                        timing,
                        title,
                        people: (row.people || '').trim(),
                        questions: [],
                        validated: false
                    });
                }

                const qText = (row.question_text || '').trim();
                const qContent = (row.question_content || '').trim();
                if (qText || qContent) {
                    groups.get(key).questions.push({ text: qText, content: qContent });
                }
            });

            for (const seq of groups.values()) {
                await addDoc(collection(db, "events", eventRef.id, "sequences"), seq);
            }
        }

        // ==================== AIRTABLE IMPORT ====================
        document.getElementById('importAirtableBtn').addEventListener('click', async () => {
            const eventName = document.getElementById('airtableEventName').value.trim();
            
            if (!eventName) {
                showToast('Entrez un nom d\'événement');
                return;
            }

            const btn = document.getElementById('importAirtableBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div>';

            try {
                const response = await fetch('/.netlify/functions/airtable-import-2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: currentUser.uid,
                        eventName: eventName
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('airtableEventName').value = '';
                    showToast(`${result.sequencesCount} séquences importées !`);
                } else {
                    throw new Error(result.error);
                }
            } catch (error) {
                showToast('Erreur Airtable: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-database"></i> Importer depuis Airtable';
            }
        });

        // ==================== TOAST ====================
        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => toast.remove(), 2500);
        }
        window.showToast = showToast;

        // ==================== KEYBOARD & SWIPE ====================
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('sequencePage').style.display !== 'flex') return;

            if (document.getElementById('prompterOverlay').classList.contains('active')) {
                switch(e.key) {
                    case ' ': e.preventDefault(); togglePrompterPlayPause(); break;
                    case 'Escape': closePrompter(); break;
                    case 'ArrowUp': adjustPrompterSpeed(1); break;
                    case 'ArrowDown': adjustPrompterSpeed(-1); break;
                    case '+': case '=': adjustTextSize(1); break;
                    case '-': adjustTextSize(-1); break;
                }
                return;
            }

            if (document.getElementById('popupOverlay').classList.contains('active')) {
                if (e.key === 'Escape') closePopup();
                return;
            }

            switch(e.key) {
                case 'ArrowUp': e.preventDefault(); goToPrevious(); break;
                case 'ArrowDown': e.preventDefault(); goToNext(); break;
                case 'Escape': goToHome(); break;
                case 'e': if (!e.ctrlKey && !e.metaKey) toggleEditMode(); break;
                case 'v': if (!e.ctrlKey && !e.metaKey) toggleValidation(); break;
            }
        });

        // Swipe gestures
        (function() {
            let touchStartY = 0;
            let touchStartX = 0;
            const page = document.getElementById('sequencePage');

            page.addEventListener('touchstart', (e) => {
                if (e.target.closest('.prev-sequence-bar, .next-sequence-bar, .progress-sidebar, button, textarea, input')) return;
                touchStartY = e.touches[0].clientY;
                touchStartX = e.touches[0].clientX;
            }, { passive: true });

            page.addEventListener('touchend', (e) => {
                if (e.target.closest('.prev-sequence-bar, .next-sequence-bar, .progress-sidebar, button, textarea, input')) return;
                
                const deltaY = e.changedTouches[0].clientY - touchStartY;
                const deltaX = e.changedTouches[0].clientX - touchStartX;

                if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 50) {
                    if (deltaY < 0) goToNext();
                    else goToPrevious();
                }
            }, { passive: true });
        })();
    </script>
</body>
</html>
